name: Bug report
description: Algo quebrou no Girassol
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar. Anexe o `last-crash.txt` quando possível:
        `adb shell run-as app.girassol cat files/last-crash.txt`
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: "1.3.1 (versionCode 6)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo / Android
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
