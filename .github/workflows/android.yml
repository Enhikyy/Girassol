name: Android CI

on:
  push:
    branches: [ main, girassol-2, "feat/**" ]
  pull_request:
    branches: [ main, girassol-2 ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default da action é 'tools', REMOVIDO do repositório do Google → falha com exit 1.
          # platform-tools é o mínimo; o resto é instalado no step sdkmanager abaixo.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: girassol-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  unit-test:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default da action é 'tools', REMOVIDO do repositório do Google → falha com exit 1.
          # platform-tools é o mínimo; o resto é instalado no step sdkmanager abaixo.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  lint:
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default da action é 'tools', REMOVIDO do repositório do Google → falha com exit 1.
          # platform-tools é o mínimo; o resto é instalado no step sdkmanager abaixo.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  device-gate:
    runs-on: ubuntu-latest
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default da action é 'tools', REMOVIDO do repositório do Google → falha com exit 1.
          # platform-tools é o mínimo; o resto é instalado no step sdkmanager abaixo.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Assemble Debug (for emulator)
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Run on emulator and capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.enhikyy.girassol/.MainActivity
            sleep 12
            adb exec-out screencap -p > mundo.png
            adb logcat -d > logcat.txt
            if grep -E "FATAL|AndroidRuntime" logcat.txt; then
              echo "FATAL encontrado no logcat" && exit 1
            fi
            adb pull /sdcard/Android/data/com.enhikyy.girassol/files/logs ./app_logs || true
      - name: Verificar screenshot nao preta (PIL)
        run: |
          pip install pillow
          python3 -c "
          from PIL import Image
          import statistics, sys
          img = Image.open('mundo.png').convert('L')
          px = list(img.getdata())
          mean = statistics.mean(px)
          stdev = statistics.stdev(px)
          print(f'luminancia media={mean:.1f} desvio={stdev:.1f}')
          if stdev <= 8 or mean <= 12:
              print('TELA PRETA/uniforme detectada'); sys.exit(1)
          print('OK: tela com conteudo visivel')
          "
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: device-evidence-api${{ matrix.api-level }}
          path: |
            mundo.png
            logcat.txt
            app_logs/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [assemble, unit-test, lint, device-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default da action é 'tools', REMOVIDO do repositório do Google → falha com exit 1.
          # platform-tools é o mínimo; o resto é instalado no step sdkmanager abaixo.
          packages: platform-tools
      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
