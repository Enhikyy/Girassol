name: Girassol Unified Android CI

on:
  push:
    branches: [ main, girassol-2, "feat/**", "integration/**" ]
  pull_request:
    branches: [ main, girassol-2, "integration/**" ]
  workflow_dispatch:

concurrency:
  group: girassol-unified-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - name: Grant wrapper permission
        run: chmod +x ./gradlew
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: girassol-unified-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Grant wrapper permission
        run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    needs: assemble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Grant wrapper permission
        run: chmod +x ./gradlew
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: girassol-unified-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
